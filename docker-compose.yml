# NOTE: The GHCR image (ghcr.io/rightnow-ai/openfang) is not yet public.
# For now, build from source using `docker compose up --build`.
# See: https://github.com/RightNow-AI/openfang/issues/12

version: "3.8"
services:
  openfang:
    build: .
    # image: ghcr.io/rightnow-ai/openfang:latest  # Uncomment when GHCR is public
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        cat >/data/config.toml <<'EOF'
        api_listen = "0.0.0.0:50051"

        [default_model]
        provider = "openrouter"
        model = "google/gemini-3.1-flash-lite-preview"
        api_key_env = "OPENROUTER_API_KEY"
        EOF
        exec openfang start
    volumes:
      - openfang-data:/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    restart: unless-stopped
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.agent-openfang-uw4d1r-101-web.rule=Host(`agent-openfang-uw4d1r-345c31-65-21-245-10.traefik.me`)
      - traefik.http.routers.agent-openfang-uw4d1r-101-web.entrypoints=web
      - traefik.http.services.agent-openfang-uw4d1r-101-web.loadbalancer.server.port=50051
      - traefik.http.routers.agent-openfang-uw4d1r-101-web.service=agent-openfang-uw4d1r-101-web
      - traefik.enable=true
    networks:
      - dokploy-network
      - default

volumes:
  openfang-data:

networks:
  dokploy-network:
    external: true
